name: Build ZAAD Admin 2026

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p fixed
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -1)"
          unzip -q -o "$ZIP" -d fixed
          PROJECT_DIR="$(dirname "$(find fixed -type f -path '*/app/build.gradle.kts' | head -1)")"
          PROJECT_DIR="$(dirname "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Change package to new ID
        run: |
          python3 - <<'PY'
          import os, re
          p = os.path.join(os.environ["PROJECT_DIR"], "app", "build.gradle.kts")
          s = open(p, encoding="utf-8").read()
          s = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.zaad.admin2026"',
              s
          )
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Add new Firebase config
        run: |
          cp google-services.json "$PROJECT_DIR/app/google-services.json"

      - name: Fix JVM 17
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAAD-ADMIN-2026-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
