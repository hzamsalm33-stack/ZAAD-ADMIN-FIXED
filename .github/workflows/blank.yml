name: Build ZAAD New Install

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p fixed
          ZIP="$(find . -maxdepth 1 -type f -name 'ZAAD-ADMIN-ANDROID-*.zip' | head -1)"
          unzip -q -o "$ZIP" -d fixed
          PROJECT_DIR="$(dirname "$(find fixed -name 'settings.gradle.kts' | head -1)")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make new independent app
        run: |
          sed -i 's/applicationId =  "com.zaad.admin"/applicationId = "com.zaad.admin.final2026"/' "$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/"package_name": "com.zaad.admin"/"package_name": "com.zaad.admin.final2026"/' "$PROJECT_DIR/app/google-services.json"

          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAAD-NEW-INSTALL-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
