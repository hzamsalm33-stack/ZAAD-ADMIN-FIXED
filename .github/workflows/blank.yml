name: Build Fixed APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p fixed
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          unzip -o "$ZIP" -d fixed

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd fixed/ZAAD-ADMIN-ANDROID-FIXED
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAAD-ADMIN-FIXED-APK
          path: fixed/ZAAD-ADMIN-ANDROID-FIXED/app/build/outputs/apk/debug/app-debug.apk
